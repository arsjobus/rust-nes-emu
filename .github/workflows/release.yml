name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: runes.exe
            output: runes-windows-x86_64.exe

          # macOS Intel
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            binary: runes
            output: runes-macos-x86_64

          # macOS Apple Silicon
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: runes
            output: runes-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Show Cargo package
        shell: bash
        run: |
          echo "Cargo.toml:"
          cat Cargo.toml

          echo
          echo "Cargo packages:"
          cargo metadata --no-deps --format-version 1

      # IMPORTANT:
      # Do not use "\" for multiline commands unless the shell is bash.
      # GitHub Actions uses PowerShell by default on Windows.
      - name: Build
        shell: bash
        run: |
          set -e

          echo "Building target: ${{ matrix.target }}"

          cargo build \
            --release \
            --target "${{ matrix.target }}"

      - name: Find binary
        shell: bash
        run: |
          set -e

          RELEASE_DIR="target/${{ matrix.target }}/release"

          echo "Files produced by Cargo:"
          echo

          if [ -d "$RELEASE_DIR" ]; then
            find "$RELEASE_DIR" \
              -maxdepth 1 \
              -type f \
              -print \
              -exec ls -lh {} \;
          else
            echo "ERROR: Release directory does not exist:"
            echo "$RELEASE_DIR"
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          set -e

          mkdir -p dist

          SOURCE="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          DEST="dist/${{ matrix.output }}"

          echo "Looking for:"
          echo "$SOURCE"

          if [ ! -f "$SOURCE" ]; then
            echo
            echo "ERROR: Expected binary does not exist."
            echo
            echo "Release directory contains:"
            ls -lah "target/${{ matrix.target }}/release/"
            echo
            echo "Cargo package:"
            cargo metadata --no-deps --format-version 1
            exit 1
          fi

          cp "$SOURCE" "$DEST"

          # This is harmless on Windows and useful for macOS/Linux.
          chmod +x "$DEST" || true

          echo
          echo "Packaged:"
          ls -lh "$DEST"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          set -e

          echo "Release files:"
          ls -lah dist/

          echo
          echo "Checking Windows binary..."
          test -f dist/runes-windows-x86_64.exe

          echo "Checking macOS Intel binary..."
          test -f dist/runes-macos-x86_64

          echo "Checking macOS Apple Silicon binary..."
          test -f dist/runes-macos-arm64

          echo
          echo "All release files are present."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/runes-windows-x86_64.exe
            dist/runes-macos-x86_64
            dist/runes-macos-arm64
          generate_release_notes: true
