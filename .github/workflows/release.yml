name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          # Windows x64
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: runes.exe
            output: runes-windows-x86_64.exe

          # macOS Intel
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            binary: runes
            output: runes-macos-x86_64

          # macOS Apple Silicon
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: runes
            output: runes-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist

          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
             "dist/${{ matrix.output }}"

          echo "Built:"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.output }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show release files
        run: |
          echo "Release files:"
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/runes-windows-x86_64.exe
            dist/runes-macos-x86_64
            dist/runes-macos-arm64
          generate_release_notes: true
